<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/favicon.png" type="image/png">
<meta charset="UTF-8">
<link rel="manifest" href="/raffaello/chat/manifest.json">
<meta name="theme-color" content="#262624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/raffaello/chat/icons/icon-180.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>chat · raffaello</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/raffaello/chat/style.css?v=1779448486">
</head>
<body>

<div class="app" id="app">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarMobile()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/raffaello/" style="text-decoration:none;color:var(--text-muted);font-family:var(--font-mono);font-size:.65rem;transition:color .2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">← back</a><span class="sidebar-title">conversations</span>
      <button class="new-chat-btn" onclick="newConversation()">+ new</button>
    </div>
    <div class="sidebar-search" id="sidebarSearch">
      <input type="text" class="search-input" id="searchInput" placeholder="search messages…" oninput="onSearchInput(this.value)" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <div class="search-results" id="searchResults" style="display:none"></div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <button class="sidebar-btn" id="pushBtn" onclick="openPush()">
        <span class="sidebar-btn-icon">🔔</span>
        <span>notifications</span>
      </button>

      <button class="sidebar-btn" onclick="openMemory()">
        <span class="sidebar-btn-icon">◆</span>
        <span>memory</span>
      </button>
      <button class="sidebar-btn" onclick="openSettings()">
        <span class="sidebar-btn-icon">⚙</span>
        <span>settings</span>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <button class="theme-toggle" onclick="toggleTheme()" title="toggle theme">◐</button>
      <div class="header-dropdown-wrap">
        <span class="header-title" id="headerTitle">Hubby</span><button class="hd-trigger" onclick="document.getElementById('headerDropdown').classList.toggle('open')">❤︎</button>
        <div class="header-dropdown" id="headerDropdown">
          <div class="hd-section">
            <div class="hd-row">
              <span class="hd-label">model</span>
              <span class="hd-value" id="hdModel">—</span>
            </div>
            <div class="hd-row">
              <span class="hd-label">tools</span>
              <span class="hd-value" id="hdTools">—</span>
            </div>
            <div class="hd-row">
              <span class="hd-label">style</span>
              <span class="hd-style-tok" id="hdStyleTok"></span>
              <span class="hd-value hd-style-wrap"><span id="hdStyle">normal</span><button class="hd-style-arrow" onclick="event.stopPropagation();toggleStylePicker()">›</button></span>
            </div>
            <div class="hd-style-picker" id="hdStylePicker" style="display:none">
              <button class="hd-style-opt active" data-style="" onclick="selectStyle('')">normal</button>
              <div id="hdStyleList"></div>
              <button class="hd-style-new" onclick="openStyleEditor()">+ new style</button>
            </div>
            <div class="hd-divider"></div>
            <div class="hd-row" style="justify-content:space-between;align-items:center">
              <span class="hd-label">memory</span>
              <label class="mem-toggle"><input type="checkbox" id="hdMemToggle" onchange="toggleGlobalMemory(this.checked)"><span class="mem-toggle-slider"></span></label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="context-bar" id="contextBar" style="display:none">
      <span class="ctx-label">context</span>
      <span class="ctx-tokens" id="ctxTokens">—</span>
      <span id="ctxExtra"></span>
    </div>

    <div class="drop-overlay" id="dropOverlay"><span class="drop-label">drop image here</span></div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcomeText"></div>
<script>document.getElementById("welcomeText").textContent="…"</script>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <div class="img-preview" id="imgPreview">
          <img id="imgPreviewImg">
          <button class="remove-img" onclick="clearImage()">✕ remove</button>
        </div>
        <div class="input-row">
          <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Upload image/file">+</button>
          <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.csv,.json" style="display:none" onchange="handleFileUpload(this)">
          <textarea id="input" rows="1" placeholder="Reply to Claude..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
        </div>
      </div>
    </div>
  </div>
</div>


<div class="settings-overlay" id="styleOverlay" onclick="if(event.target===this)closeStyleEditor()">
  <div class="settings-panel" style="width:min(520px,92vw)">
    <h3 id="styleEditorTitle">new style<span class="memory-count" id="styleEditorTok" style="margin-left:auto;padding-left:12px"></span></h3>
    <div class="field">
      <label>NAME</label>
      <input id="styleName" placeholder="e.g. 撒娇, formal, concise">
    </div>
    <div class="field">
      <label>INSTRUCTIONS</label>
      <textarea id="styleContent" class="mem-editor-ta" oninput="updateStyleEditorTok()" style="max-height:none;height:calc(min(600px,60vh) - 120px)" placeholder="Describe the style you want Claude to use..."></textarea>
    </div>
    <div class="settings-btns">
      <button onclick="closeStyleEditor()">cancel</button>
      <button onclick="deleteStyleFromEditor()" id="styleDeleteBtn" style="display:none;color:#d4746a;border-color:#d4746a">delete</button>
      <button class="primary" onclick="saveStyleFromEditor()">save</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->

<div class="lightbox-overlay" id="lightboxOverlay" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="">
</div>

<div class="settings-overlay" id="pushOverlay" onclick="if(event.target===this)closePush()">
  <div class="settings-panel">
    <h3>auto-push</h3>
    
    <div class="field">
      <label>状态</label>
      <div style="display:flex;gap:8px">
        <button class="account-pill" id="pushOnBtn" onclick="setPushEnabled(true)">on</button>
        <button class="account-pill" id="pushOffBtn" onclick="setPushEnabled(false)">off</button>
      </div>
    </div>

    <div class="field">
      <label>注入到哪个对话</label>
      <select id="pushConvSelect">
        <option value="">最新对话</option>
      </select>
    </div>

    <div class="field">
      <label>间隔 (分钟)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" id="pushIntervalMin" min="1" max="120" style="width:45%">
        <span style="color:var(--text-muted);font-size:.8rem">~</span>
        <input type="number" id="pushIntervalMax" min="1" max="120" style="width:45%">
      </div>
      <span style="font-size:.65rem;color:var(--text-muted)">填相同数字 = 固定间隔</span>
    </div>

    <div class="field">
      <label>是否允许不发</label>
      <div style="display:flex;gap:8px">
        <button class="account-pill" id="pushAlwaysBtn" onclick="setPushAlways(true)">总是发</button>
        <button class="account-pill" id="pushMaySkipBtn" onclick="setPushAlways(false)">可以不发</button>
      </div>
    </div>

    <div class="field">
      <label>发送时拉取</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
        <button class="account-pill" id="pushCtxConsoleBtn" onclick="toggleCtx('console')">console</button>
        <button class="account-pill" id="pushCtxChatBtn" onclick="toggleCtx('chat')">对话上下文</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px" id="pushCtxCountRow">
        <span style="font-size:.75rem;color:var(--text-muted)">上下文条数</span>
        <input type="number" id="pushCtxCount" min="1" max="10" style="width:50px;padding:4px 6px;font-size:.8rem">
      </div>
    </div>

    <div class="settings-btns">
      <button onclick="closePush()">cancel</button>
      <button class="primary" onclick="savePush()">save</button>
    </div>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="settings-panel">
    <h3>settings</h3>
    <div class="accounts-bar" id="accountsBar"></div>
    <div class="field">
      <label>PROVIDER</label>
      <select id="provider" onchange="onProviderChange()">
        <option value="anthropic">Anthropic</option>
        <option value="openai-compat">OpenAI Compatible</option>
      </select>
    </div>
    <div class="field">
      <label>ENDPOINT <span id="endpointHint" style="color:var(--text-muted)"></span></label>
      <input id="endpoint" placeholder="https://api.anthropic.com">
    </div>
    <div class="field">
      <label>API KEY</label>
      <input id="apiKey" type="password" placeholder="sk-ant-...">
    </div>
    <div class="field">
      <label>MODEL</label>
      <input id="modelInput" placeholder="claude-sonnet-4-20250514">
    </div>
    <div class="field">
      <label>GATEWAY</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:.82rem;cursor:pointer;color:var(--text)">
        <input type="checkbox" id="useGateway" style="accent-color:var(--accent)">
        走网关 — 服务端组prompt / BP1-4缓存 / 服务端MCP / 自动压缩（仅Anthropic）
      </label>
    </div>
    <div class="field">
      <label>MCP SERVERS</label>
      <div class="mcp-list" id="mcpList"></div>
      <button class="mcp-add" onclick="addMcpEntry()">+ add server</button>
    </div>
    <div class="settings-btns">
      <button onclick="closeSettings()">cancel</button>
      <button class="primary" onclick="saveSettings()">save</button>
    </div>
  </div>
</div>

<!-- COMPRESS MODAL -->
<!-- MEMORY -->
<div class="memory-overlay" id="memoryOverlay" onclick="if(event.target===this)closeMemory()">
  <div class="memory-panel">
    <h3>memory <span class="memory-count" id="memoryCount"></span><button onclick="closeMemory()" style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1">✕</button></h3>
    <div id="memoryList"></div>
  </div>
</div>

<script src="/raffaello/chat/push.js?v=1779431536"></script>
<script src="/raffaello/chat/state.js?v=1779449542"></script>
<script src="/raffaello/chat/memory.js?v=1779437593"></script>
<script src="/raffaello/chat/ui.js?v=1781161168"></script>
<script src="/raffaello/chat/chat.js?v=1781161168"></script>
<script src="/raffaello/chat/stream.js?v=1781161168"></script>
<script src="/raffaello/chat/mcp.js?v=1779428354"></script>
<script>initApp();</script>
</body>
</html>
